{% extends 'base.html' %}
{% block title %}Verify OTP | Smart Canteen{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2>Verify Mobile Number</h2>
    <p class="muted-text">Enter the 6-digit OTP sent to {{ phone }}</p>

    <form method="post" action="{{ url_for('verify_mobile_login') }}">
      <div>
        <label for="otp">OTP</label>
        <input id="otp" type="text" name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required />
      </div>
      <button type="submit" class="btn btn-primary">Verify OTP</button>
    </form>

    <form method="post" action="{{ url_for('resend_mobile_otp') }}" class="inline-form">
      <button type="submit" class="btn btn-secondary">Resend OTP</button>
    </form>

    <p class="auth-link">
      <a href="{{ url_for('login_mobile') }}">Change mobile number</a>
    </p>
  </div>
</section>
{% endblock %}
