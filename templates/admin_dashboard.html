{% extends 'base.html' %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
<section class="container page-head">
  <h1>Admin Dashboard</h1>
  <div class="dashboard-grid">
    <div class="stat-card"><h3>Orders</h3><strong>{{ dashboard.orders }}</strong></div>
    <div class="stat-card"><h3>Revenue</h3><strong>₹{{ dashboard.revenue }}</strong></div>
    <div class="stat-card"><h3>Users</h3><strong>{{ dashboard.users }}</strong></div>
    <div class="stat-card"><h3>Best Item</h3><strong>{{ dashboard.best_item }}</strong></div>
  </div>
</section>
{% endblock %}
